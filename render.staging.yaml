services:
  - type: web
    name: lb-performance-staging
    env: node
    plan: free
    branch: feature/metodo-lb-v1
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: ALLOW_LEGACY_DOB_LOGIN
        value: "false"
      - key: VITE_LB_CORE_WORKFLOW
        value: "false"
      - key: VITE_LB_INTERPRETATION
        value: "false"
      - key: VITE_LB_DECISION
        value: "false"
      - key: VITE_LB_PRESCRIPTION
        value: "false"
      - key: VITE_LB_MONITORING
        value: "false"
      - key: VITE_LB_REASSESSMENT
        value: "false"
      - key: VITE_LB_TRANSFER
        value: "false"
      - key: VITE_LB_PREMIUM_REPORTS
        value: "false"
